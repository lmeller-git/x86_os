name: Rust test CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        components: rust-src

    - name: Install target
      run: rustup target add x86_64-unknown-none

    - name: install deps
      run: cargo install bootimage

    # - name: Build 
      # run: cargo build --release

    - name: Bootimage
      run: cargo bootimage
      
    - name: Test
      run: cargo test
